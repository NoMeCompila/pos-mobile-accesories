name: Deploy Migrations to Supabase DEV

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - 'supabase/migrations/**'

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link and push migrations to DEV
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_DEV_PROJECT_REF }} --password ${{ secrets.SUPABASE_DEV_DB_PASSWORD }}
          supabase db push --password ${{ secrets.SUPABASE_DEV_DB_PASSWORD }}
